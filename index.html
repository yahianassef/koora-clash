<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1f17">
  <title>Koora Clash</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="static/app.css">
</head>
<body>
  <div class="landing">
    <div class="row"><span class="grow"></span><button class="ghost small" onclick="toggleLang()" data-t="lang"></button></div>
    <h1 class="brand">⚽ <b data-t="brand"></b></h1>
    <p class="muted" style="font-size:20px" data-t="tagline"></p>

    <div class="tabs" role="tablist">
      <button role="tab" data-tab="party" data-t="tab_party"></button>
      <button role="tab" data-tab="solo" data-t="tab_solo"></button>
    </div>

    <section class="tabpane" id="tab-party">
      <p class="muted" data-t="party_hint"></p>
      <div class="choices" style="margin-top:12px">
        <a class="card choice" href="host.html">
          <div class="ico">📺</div><h2 data-t="host_game"></h2><div class="muted" data-t="host_hint"></div>
        </a>
        <a class="card choice" href="play.html">
          <div class="ico">📱</div><h2 data-t="join_game"></h2><div class="muted" data-t="join_hint"></div>
        </a>
      </div>
      <div class="seglist" id="segs"></div>
    </section>

    <section class="tabpane" id="tab-solo" hidden>
      <p class="muted" data-t="solo_hint"></p>
      <div class="sologrid" id="sologames" style="margin-top:12px"></div>
    </section>
  </div>
  <script src="static/common.js"></script>
  <script>
    const SOLO_LIST = [["nameall", "📝"], ["career", "🧭"], ["survival", "❤️"], ["mystery", "❓"]];
    function showTab(name) {
      document.querySelectorAll("[data-tab]").forEach((b) => b.classList.toggle("on", b.dataset.tab === name));
      $("#tab-party").hidden = name !== "party";
      $("#tab-solo").hidden = name !== "solo";
      try { localStorage.setItem("kc_tab", name); } catch (e) {}
      history.replaceState(null, "", "#" + name);
    }
    document.querySelectorAll("[data-tab]").forEach((b) => { b.onclick = () => showTab(b.dataset.tab); });
    RERENDER = () => {
      $("#segs").innerHTML = ["career", "rondo", "spy", "password", "quickfire"]
        .map((k) => `<div class="card"><div style="font-size:28px">${SEG_ICON[k]}</div><b>${esc(segTitle(k))}</b></div>`).join("");
      $("#sologames").innerHTML = SOLO_LIST.map(([k, ico]) => `<a class="card sologame" href="solo.html?g=${k}">
        <div class="ico">${ico}</div><h3>${esc(t("g_" + k))}</h3><div class="muted">${esc(t("g_" + k + "_d"))}</div></a>`).join("");
    };
    applyLang(); RERENDER();
    let start = location.hash.slice(1);
    if (!start) { try { start = localStorage.getItem("kc_tab"); } catch (e) {} }
    showTab(start === "solo" ? "solo" : "party");
  </script>
</body>
</html>
