<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#070b14">
  <title>Koora Clash</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Lalezar&family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="static/app.css">
</head>
<body>
  <div class="landing">
    <nav class="topnav">
      <a class="brand" href="index.html"><span class="ball" data-icon="ball"></span><b data-t="brand"></b></a>
      <span class="grow"></span>
      <button class="ghost small" onclick="toggleLang()" data-t="lang"></button>
    </nav>

    <section class="hero">
      <div>
        <span class="eyebrow"><span data-icon="fire"></span><span data-t="eyebrow"></span></span>
        <h1><span data-t="hero_a"></span><span class="hl" data-t="hero_b"></span></h1>
        <p class="lead" data-t="hero_sub"></p>
        <div class="cta">
          <a class="btn primary big" href="host.html"><span data-icon="tv"></span><span data-t="cta_host"></span></a>
          <a class="btn big" href="#solo" id="cta-solo"><span data-icon="ball"></span><span data-t="cta_solo"></span></a>
        </div>
        <div class="stats" id="stats"></div>
      </div>
      <div class="hero-ball" data-icon="ball"></div>
    </section>

    <a class="card daily" href="#solo" id="daily-link">
      <span class="q" data-icon="mystery"></span>
      <span><b data-t="daily_title"></b><span class="muted" data-t="daily_sub"></span></span>
      <span class="go btn primary" data-icon="arrow"></span>
    </a>

    <div class="tabs" role="tablist">
      <button role="tab" data-tab="party" data-t="tab_party"></button>
      <button role="tab" data-tab="solo" data-t="tab_solo"></button>
    </div>

    <section class="tabpane" id="tab-party">
      <p class="muted" data-t="party_hint"></p>
      <div class="choices">
        <a class="choice c-host" href="host.html">
          <div class="ico" data-icon="tv"></div><h2 data-t="host_game"></h2><div class="muted" data-t="host_hint"></div>
          <span class="bg" data-icon="tv"></span>
        </a>
        <a class="choice c-join" href="play.html">
          <div class="ico" data-icon="phone"></div><h2 data-t="join_game"></h2><div class="muted" data-t="join_hint"></div>
          <span class="bg" data-icon="phone"></span>
        </a>
      </div>
      <div class="seglist" id="segs"></div>
    </section>

    <section class="tabpane" id="tab-solo" hidden>
      <p class="muted" data-t="solo_hint"></p>
      <div class="sologrid" id="sologames"></div>
    </section>
  </div>
  <script src="static/common.js"></script>
  <script>
    const SOLO_LIST = ["nameall", "career", "survival", "mystery"];
    let COUNTS = null;
    function showTab(name) {
      document.querySelectorAll("[data-tab]").forEach((b) => b.classList.toggle("on", b.dataset.tab === name));
      $("#tab-party").hidden = name !== "party";
      $("#tab-solo").hidden = name !== "solo";
      try { localStorage.setItem("kc_tab", name); } catch (e) {}
      history.replaceState(null, "", "#" + name);
    }
    document.querySelectorAll("[data-tab]").forEach((b) => { b.onclick = () => showTab(b.dataset.tab); });
    $("#daily-link").onclick = (e) => { e.preventDefault(); showTab("solo"); $(".tabs").scrollIntoView({ behavior: "smooth" }); };
    $("#cta-solo").onclick = (e) => { e.preventDefault(); showTab("solo"); $(".tabs").scrollIntoView({ behavior: "smooth" }); };

    // Live counts straight from the content files, so the numbers are always true.
    let QZ = null;
    Promise.all(["data/questions.json", "data/players.json", "data/quizzes.json"].map((f) => fetch(f).then((r) => r.json())))
      .then(([q, p, qz]) => {
        QZ = qz;
        COUNTS = { career: q.career.length, cats: q.rondo.length, q: q.quickfire.length + q.words.length, players: p.players.length };
        RERENDER();
      }).catch(() => {});

    // "3/8" quizzes finished on this device for a game.
    function quizDone(k) {
      if (!QZ || !QZ[k]) return null;
      let prog = {};
      try { prog = JSON.parse(localStorage.getItem("kc_progress") || "{}"); } catch (e) {}
      return `${QZ[k].filter((q) => prog[q.id]).length}/${QZ[k].length}`;
    }
    function countUp(el) {
      const end = +el.dataset.n, t0 = performance.now();
      (function f(t) { const k = Math.min(1, (t - t0) / 900); el.textContent = Math.round(end * (1 - Math.pow(1 - k, 3))); if (k < 1) requestAnimationFrame(f); })(t0);
    }
    RERENDER = () => {
      $("#segs").innerHTML = ["career", "who", "rondo", "spy", "password", "quickfire"]
        .map((k) => `<span class="chip c-${k}">${SEG_ICON[k]} ${esc(segTitle(k))}</span>`).join("");
      $("#sologames").innerHTML = SOLO_LIST.map((k) => soloTile(k, quizDone(k), `href="solo.html?g=${k}"`)).join("");
      if (COUNTS) {
        $("#stats").innerHTML = [["career", "stat_career"], ["cats", "stat_cats"], ["q", "stat_q"], ["players", "stat_players"]]
          .map(([k, label]) => `<div class="stat"><b data-n="${COUNTS[k]}">0</b><span>${t(label)}</span></div>`).join("");
        document.querySelectorAll(".stat b").forEach(countUp);
      }
    };
    applyLang(); RERENDER();
    let start = location.hash.slice(1);
    if (!start) { try { start = localStorage.getItem("kc_tab"); } catch (e) {} }
    showTab(start === "solo" ? "solo" : "party");
  </script>
</body>
</html>
