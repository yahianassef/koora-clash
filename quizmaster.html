<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#070b14">
  <title>Koora Clash · Quizmaster</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Lalezar&family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="static/app.css">
</head>
<body>
  <div class="qm">
    <header class="row">
      <a class="brand" href="index.html"><span class="ball" data-icon="ball"></span><b data-t="brand"></b></a>
      <span class="chip" data-t="qm_badge"></span>
      <span class="grow"></span>
      <button class="ghost small" id="eye"></button>
      <button class="ghost small" onclick="toggleLang()" data-t="lang"></button>
    </header>
    <div class="qm-grid">
      <main id="stage" class="stage"></main>
      <aside class="card board">
        <h3 style="margin-top:0" data-t="scoreboard"></h3>
        <div id="board"></div>
        <button class="small ghost" id="undo" style="margin-top:6px"></button>
      </aside>
    </div>
  </div>
  <script src="static/common.js"></script>
  <script src="static/game.js"></script>
  <script src="static/quizmaster.js"></script>
</body>
</html>
